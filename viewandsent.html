<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View DR Data (Editable & Save All)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      background: #e8eef5;
      background-image: linear-gradient(135deg, rgba(255,255,255,.8), transparent 45%), linear-gradient(315deg, rgba(17, 61, 87, .12), transparent 50%);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      color: #173042;
    }
    .container {
      background: rgba(255, 255, 255, .96);
      padding: 34px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(25, 52, 70, .14);
      width: 100%;
      max-width: none;
    }
    .page-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 26px; }
    h2 {
      color: #123b51;
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.7px;
    }
    .page-heading p { margin: 6px 0 0; color: #718494; font-size: 13px; }
    .alert {
      color: #b42318;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
      border: 1px solid #dbe5ec;
      border-radius: 12px;
      background: #fff;
    }
    table th, table td {
      padding: 11px 14px;
      text-align: center;
      border: 1px solid #dbe5ec;
    }
    table th {
      background: #123b51;
      color: white;
      font-size: 12px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    table td {
      font-size: 13px;
      color: #304b5b;
    }
    table td[contenteditable="true"] {
      background-color: #f5f9fb;
      outline: none;
      cursor: text;
    }
    .table-container {
      overflow-x: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #1c7180;
      color: white;
      padding: 10px 15px;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      margin: 0;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .btn:hover {
      background-color: #155b67;
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(21, 91, 103, .2);
    }
    .report-btn {
      background-color: #d97706;
    }
    .report-btn:hover {
      background-color: #b45309;
    }
    .compact-report-btn {
      background-color: #343a40;
    }
    .compact-report-btn:hover {
      background-color: #23272b;
    }
    .loading {
      text-align: center;
      font-size: 18px;
      color: #1c7180;
      margin: 24px 0;
    }
    select {
      padding: 10px 12px;
      font-size: 14px;
      margin: 0 0 18px 8px;
      border: 1px solid #c8d6df;
      border-radius: 8px;
      color: #173042;
      background: #fff;
    }
    .selector-label { color: #476170; font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .actions .btn:first-child { background: #617583; }
    .actions .btn:first-child:hover { background: #4b606e; }
    @media (max-width: 700px) {
      body { padding: 14px 10px; }
      .container { padding: 22px 14px; border-radius: 14px; }
      .page-heading { display: block; }
      h2 { font-size: 23px; }
      .table-container { margin-left: -4px; margin-right: -4px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      .actions .btn { width: 100%; text-align: center; }
      .actions .btn:first-child, .actions .btn:last-child { grid-column: 1 / -1; }
      select { margin-left: 0; width: 100%; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7k0MQEV0Q1Yehjy4pZZhGnQaBrQMhKEU",
      authDomain: "drgenerator-c598e.firebaseapp.com",
      projectId: "drgenerator-c598e",
      storageBucket: "drgenerator-c598e.appspot.com",
      messagingSenderId: "936022417844",
      appId: "1:936022417844:web:e4f2778b3313fc8c78d2e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let drDataMap = {};

    window.addEventListener('DOMContentLoaded', async () => {
      const tableBody = document.getElementById("data-body");
      const loadingMessage = document.getElementById("loading");
      const drSelect = document.getElementById("dr-selector");

      loadingMessage.textContent = "Loading data...";

      try {
        const now = new Date();
        const datePath = now.toISOString().split('T')[0];
        const drRef = ref(db, datePath);
        const snapshot = await get(drRef);

        if (snapshot.exists()) {
          const data = snapshot.val();
          const sortedKeys = Object.keys(data).sort((a, b) => {
            const numA = parseInt(a.replace(/[^\d]/g, ''));
            const numB = parseInt(b.replace(/[^\d]/g, ''));
            return numA - numB;
          });

          sortedKeys.forEach(drNumber => {
            const drDetails = data[drNumber].details;
            drDataMap[drNumber] = drDetails;

            const option = document.createElement("option");
            option.value = drNumber;
            option.textContent = drNumber;
            drSelect.appendChild(option);

            const row = document.createElement('tr');
            row.innerHTML = `
              <td contenteditable="true" data-dr="${drNumber}" data-field="veco">${drDetails.veco || ""}</td>
              <td contenteditable="true" data-dr="${drNumber}" data-field="size">${drDetails.size || ""}</td>
              <td contenteditable="true" data-dr="${drNumber}" data-field="quantity">${drDetails.quantity || ""}</td>
              <td contenteditable="true" data-dr="${drNumber}" data-field="pis">${drDetails.pis || ""}</td>
              <td contenteditable="true" data-dr="${drNumber}" data-field="cpris">${drDetails.cpris || ""}</td>
              <td contenteditable="true" data-dr="${drNumber}" data-field="trucking">${drDetails.trucking || ""}</td>
              <td contenteditable="true" data-dr="${drNumber}" data-field="plate">${drDetails.plate || ""}</td>
              <td contenteditable="true" data-dr="${drNumber}" data-field="driver">${drDetails.driver || ""}</td>
              <td contenteditable="true" data-dr="${drNumber}" data-field="poleSeries">${drDetails.poleSeries || ""}</td>
            `;

            // Track edits
            row.querySelectorAll("[contenteditable]").forEach(cell => {
              cell.addEventListener("input", () => {
                const drNo = cell.getAttribute("data-dr");
                const field = cell.getAttribute("data-field");
                drDataMap[drNo][field] = cell.innerText.trim();
              });
            });

            tableBody.appendChild(row);
          });
        } else {
          showAlert("No data found for today.", "error");
        }
      } catch (err) {
        showAlert("Error fetching data: " + err.message, "error");
      }

      loadingMessage.style.display = "none";

      // Generate the two-block report layout. Work order, CPRIS, and DR# stay blank.
      document.getElementById('generate-report').addEventListener('click', () => {
        const reportDate = new Date().toLocaleDateString('en-US');
        const sizeLabels = {
          '9.0/5': '30FT',
          '12.0/3A': '40FT',
          '13.5/3A': '45FT',
          '15.0/3A': '50FT',
          '12.5/1A': '90FT',
          '15.0/1A': '90FT',
          '12.5/1': '75FT',
          '10.5/1': '75FT'
        };
        const rows = [
          ['WORK ORDER', 'CONTRACTOR', 'DATE', 'PRS#', 'QTY', 'SIZE', '', 'DATE', 'PRS#', 'CPRIS#', 'QTY', 'DR#', 'POLE SERIES', 'RELEASE BY', 'CONTRACTOR'],
          ...Object.values(drDataMap).map(data => [
            '',
            data.trucking || '',
            '',
            data.pis || '',
            data.quantity || '',
            sizeLabels[data.size] || data.size || '',
            '',
            reportDate,
            data.pis || '',
            data.cpris || '',
            data.quantity || '',
            '',
            data.poleSeries || '',
            'L. LOGRONIO',
            data.trucking || ''
          ])
        ];
        if (rows.length === 1) {
          alert('No DR data available for the report.');
          return;
        }
        const worksheet = XLSX.utils.aoa_to_sheet(rows);
        worksheet['!cols'] = [
          { wch: 16 }, { wch: 18 }, { wch: 13 }, { wch: 12 }, { wch: 8 }, { wch: 10 }, { wch: 3 },
          { wch: 13 }, { wch: 12 }, { wch: 12 }, { wch: 8 }, { wch: 12 }, { wch: 22 }, { wch: 20 }, { wch: 18 }
        ];
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Report');
        XLSX.writeFile(workbook, 'DR_Report.xlsx');
      });

      // Generate the compact report format shown in the reference image.
      document.getElementById('generate-compact-report').addEventListener('click', () => {
        const rows = [
          ['CPRIS#', 'DR#', 'PO#', 'PRS#', 'CONTRACTOR', 'POLE SERIES'],
          ...Object.values(drDataMap).map(data => [
            data.cpris || '',
            '',
            '',
            data.pis || '',
            data.trucking || '',
            data.poleSeries || ''
          ])
        ];
        if (rows.length === 1) {
          alert('No DR data available for the report.');
          return;
        }
        const worksheet = XLSX.utils.aoa_to_sheet(rows);
        worksheet['!cols'] = [
          { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 14 }, { wch: 18 }, { wch: 24 }
        ];
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Compact Report');
        XLSX.writeFile(workbook, 'DR_Compact_Report.xlsx');
      });

      // Send SMS
      document.getElementById('send-sms').addEventListener('click', () => {
        const selectedDR = drSelect.value;
        if (!selectedDR || !drDataMap[selectedDR]) {
          alert("Please select a valid DR number.");
          return;
        }

        const data = drDataMap[selectedDR];
        const formattedQuantity = (data.quantity || "").replace(/\s*-\s*/g, "-");

        const message = 
`VECO
${data.veco}

${data.size || ""}-${formattedQuantity}
PIS#: ${data.pis || ""}
CPRIS#: ${data.cpris || ""}
TRUCKING: ${data.trucking || ""}
PLATE#: ${data.plate || ""}
DRIVER'S NAME: ${data.driver || ""}
POLE SERIES: ${data.poleSeries || ""}`;

        const phoneNumber = "09175165597";
        const encodedMsg = encodeURIComponent(message);
        window.location.href = `sms:${phoneNumber}?body=${encodedMsg}`;
      });

      // Save all changes
      document.getElementById('save-changes').addEventListener('click', async () => {
        const now = new Date();
        const datePath = now.toISOString().split('T')[0];

        try {
          for (const drNo in drDataMap) {
            const drRef = ref(db, `${datePath}/${drNo}/details`);
            await update(drRef, drDataMap[drNo]);
          }
          alert("All changes saved to database!");
        } catch (err) {
          alert("Error saving changes: " + err.message);
        }
      });
    });

    function showAlert(message, type) {
      const alertDiv = document.getElementById("alert");
      alertDiv.textContent = message;
      alertDiv.className = `alert ${type}`;
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="page-heading">
      <div>
        <h2>Delivery Receipts</h2>
        <p>Review, update, and prepare today's delivery records.</p>
      </div>
    </div>
    <div id="alert" class="alert"></div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>VECO</th>
            <th>Size</th>
            <th>Quantity</th>
            <th>PIS#</th>
            <th>CPRIS#</th>
            <th>Trucking</th>
            <th>Plate#</th>
            <th>Driver</th>
            <th>Pole Series</th>
          </tr>
        </thead>
        <tbody id="data-body"></tbody>
      </table>
    </div>

    <div id="loading" class="loading">Loading data...</div>

    <label class="selector-label" for="dr-selector"><strong>Select DR# for SMS</strong></label>
    <select id="dr-selector">
      <option value="">-- Select DR# --</option>
    </select>

    <br><br>

    <div class="actions">
      <a href="index.html" class="btn">Back to DR Generator</a>
      <a href="#" class="btn" id="send-sms">Send Selected DR as SMS</a>
      <a href="#" class="btn report-btn" id="generate-report">Generate Report</a>
      <a href="#" class="btn compact-report-btn" id="generate-compact-report">Generate Compact Report</a>
      <a href="#" class="btn" id="save-changes">Save All Changes to Database</a>
    </div>
  </div>
</body>
</html>
