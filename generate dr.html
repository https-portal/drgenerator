<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DR GENERATOR | Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-dark: #0f172a;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    .form-container {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 650px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(to right, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .full-width { grid-column: span 2; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      background-color: var(--input-bg);
      transition: all 0.2s ease;
      box-sizing: border-box;
      color: var(--text-main);
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background-color: #fff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    input[readonly] {
      background-color: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
      border-style: dashed;
    }

    .button-stack {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
    }

    .back-link {
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      padding: 8px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--primary); }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      max-width: 400px;
      position: relative;
    }

    .modal-content h3 { margin-top: 0; color: #10b981; }

    .close-modal {
      margin-top: 20px;
      background: #f1f5f9;
      color: #475569;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7k0MQEV0Q1Yehjy4pZZhGnQaBrQMhKEU",
      authDomain: "drgenerator-c598e.firebaseapp.com",
      projectId: "drgenerator-c598e",
      storageBucket: "drgenerator-c598e.appspot.com",
      messagingSenderId: "936022417844",
      appId: "1:936022417844:web:e4f2778b3313fc8c78d2e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function getNextDRNumber(datePath) {
      const drListRef = ref(db, datePath);
      const snapshot = await get(drListRef);
      if (!snapshot.exists()) return 1;
      let maxNumber = 0;
      const records = snapshot.val();
      Object.keys(records).forEach(key => {
        if (key.startsWith("vecodr")) {
          const num = parseInt(key.replace("vecodr", ""), 10);
          if (num > maxNumber) maxNumber = num;
        }
      });
      return maxNumber + 1;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById("drForm");
      const sizeSelect = document.getElementById("size");
      const truckingSelect = document.getElementById("trucking");
      const plateSelect = document.getElementById("plate");
      const driverSelect = document.getElementById("driver");
      const poleSeriesInput = document.getElementById("poleSeries");
      const modal = document.getElementById("successModal");

      const seriesMap = {
        "9.0/5": "POL-C0903110",
        "12.0/3A": "POL-C1203110",
        "13.5/3A": "POL-C1303110",
        "15.0/3A": "POL-C1503110"
      };

      sizeSelect.addEventListener("change", () => {
        poleSeriesInput.value = seriesMap[sizeSelect.value] || "";
      });

      // Load Sizes
      get(ref(db, 'size')).then(snapshot => {
        if (snapshot.exists()) {
          Object.values(snapshot.val()).forEach(size => {
            let opt = new Option(size, size);
            sizeSelect.add(opt);
          });
        }
      });

      // Load Contractors
      get(ref(db, "/contractors")).then(snapshot => {
        if (snapshot.exists()) {
          Object.keys(snapshot.val()).forEach(name => {
            truckingSelect.add(new Option(name, name));
          });
        }
      });

      truckingSelect.addEventListener("change", () => {
        plateSelect.innerHTML = "";
        driverSelect.innerHTML = "";
        get(ref(db, `/contractors/${truckingSelect.value}`)).then(snapshot => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            Object.keys(data).forEach(key => {
              if (key.startsWith("plateNumber")) plateSelect.add(new Option(data[key], data[key]));
              if (key.startsWith("driverName")) driverSelect.add(new Option(data[key], data[key]));
            });
          }
        });
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const now = new Date();
        const datePath = now.toISOString().split('T')[0];
        
        try {
          const nextNum = await getNextDRNumber(datePath);
          const vecoNum = "#" + nextNum;
          document.getElementById("veco").value = vecoNum;

          await set(ref(db, `${datePath}/vecodr${nextNum}`), {
            details: {
              client: document.getElementById("client").value,
              veco: vecoNum,
              size: sizeSelect.value,
              quantity: document.getElementById("qty").value,
              pis: document.getElementById("pis").value,
              cpris: document.getElementById("cpris").value,
              trucking: truckingSelect.value,
              plate: plateSelect.value,
              driver: driverSelect.value,
              poleSeries: poleSeriesInput.value
            }
          });

          modal.style.display = "flex";
          document.getElementById("cpris").value = (parseInt(document.getElementById("cpris").value) || 0) + 1;
        } catch (err) {
          alert("Error: " + err.message);
        }
      });

      window.closeMsg = () => modal.style.display = "none";
    });
  </script>
</head>
<body>

<div class="form-container">
  <header>
    <h2>DR GENERATOR</h2>
    <p class="subtitle">Enter delivery receipt details below</p>
  </header>

  <form id="drForm" class="form-grid">
    <div class="input-group">
      <label>Client</label>
      <input type="text" id="client" value="VECO" required>
    </div>

    <div class="input-group">
      <label>DR # (Auto)</label>
      <input type="text" id="veco" placeholder="Generated on save" readonly>
    </div>

    <div class="input-group">
      <label>Size</label>
      <select id="size" required>
        <option value="" disabled selected>Select size</option>
      </select>
    </div>

    <div class="input-group">
      <label>Quantity</label>
      <input type="number" id="qty" placeholder="0" required>
    </div>

    <div class="input-group">
      <label>PIS#</label>
      <input type="text" id="pis" required>
    </div>

    <div class="input-group">
      <label>CPRIS#</label>
      <input type="text" id="cpris" required>
    </div>

    <div class="input-group full-width">
      <label>Pole Series Number</label>
      <input type="text" id="poleSeries" required placeholder="Auto-filled or manual entry">
    </div>

    <div class="input-group full-width">
      <label>Trucking Company</label>
      <select id="trucking" required>
        <option value="" disabled selected>Select contractor</option>
      </select>
    </div>

    <div class="input-group">
      <label>Plate#</label>
      <select id="plate" required></select>
    </div>

    <div class="input-group">
      <label>Driver's Name</label>
      <select id="driver" required></select>
    </div>

    <div class="button-stack full-width">
      <button type="submit">Generate Receipt</button>
      <a href="index.html" class="back-link">Return to Dashboard</a>
    </div>
  </form>
</div>

<div id="successModal" class="modal">
  <div class="modal-content">
    <h3>Success!</h3>
    <p>The Delivery Receipt has been recorded successfully in the database.</p>
    <button class="close-modal" onclick="closeMsg()">Dismiss</button>
  </div>
</div>

</body>
</html>
