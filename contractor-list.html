<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contractor List</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(at 0% 0%, hsla(214,84%,70%,1) 0, transparent 50%),
                  radial-gradient(at 50% 0%, hsla(220,58%,16%,1) 0, transparent 50%),
                  radial-gradient(at 100% 0%, hsla(214,84%,70%,1) 0, transparent 50%);
      background-color: #0f172a;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      color: #1e293b;
    }
    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 36px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    h2 { margin: 0 0 8px; text-align: center; }
    .subtitle { margin: 0 0 24px; text-align: center; color: #64748b; font-size: 14px; }
    .contractor-select { margin-bottom: 20px; }
    .contractor-select label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; }
    select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 9px; background: #f8fafc; color: #1e293b; font: inherit; }
    .alert { display: none; padding: 12px; margin-bottom: 18px; border-radius: 10px; text-align: center; font-weight: 600; }
    .alert.success { display: block; background: #dcfce7; color: #166534; }
    .alert.error { display: block; background: #fee2e2; color: #991b1b; }
    .contractor-group { margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
    .contractor-heading { padding: 13px 16px; background: #f1f5f9; font-weight: 700; }
    .contractor-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 11px 16px; border-top: 1px solid #e2e8f0; }
    .contractor-item strong { display: block; color: #64748b; font-size: 11px; text-transform: uppercase; }
    .item-actions { display: flex; gap: 7px; }
    button { border: 0; border-radius: 9px; padding: 9px 13px; color: #fff; background: #2563eb; font-weight: 700; cursor: pointer; }
    button:hover { filter: brightness(0.9); }
    .delete-btn { background: #dc2626; }
    .navigation { display: flex; gap: 10px; margin-top: 22px; }
    .navigation button { flex: 1; background: #64748b; }
    .empty-list { color: #64748b; text-align: center; }
    @media (max-width: 560px) {
      .container { padding: 26px 18px; }
      .contractor-item { grid-template-columns: 1fr; }
      .item-actions button { flex: 1; }
      .navigation { flex-direction: column; }
    }
  </style>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
    import { getDatabase, ref, get, set, remove } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyA7k0MQEV0Q1Yehjy4pZZhGnQaBrQMhKEU',
      authDomain: 'drgenerator-c598e.firebaseapp.com',
      projectId: 'drgenerator-c598e',
      storageBucket: 'drgenerator-c598e.firebasestorage.app',
      messagingSenderId: '936022417844',
      appId: '1:936022417844:web:e4f2778b3313fc8c78d2e1',
      measurementId: 'G-7WDR6XCDVE'
    };

    const database = getDatabase(initializeApp(firebaseConfig));
    const list = document.getElementById('contractorList');
    const contractorSelect = document.getElementById('contractorSelect');
    let contractors = {};

    function normalized(value) {
      return value.trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function displayAlert(message, type) {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert ${type}`;
    }

    async function loadContractors() {
      list.innerHTML = '<p class="empty-list">Loading contractors...</p>';
      try {
        const snapshot = await get(ref(database, 'contractors'));
        if (!snapshot.exists()) {
          contractorSelect.innerHTML = '<option value="">No contractors found</option>';
          list.innerHTML = '<p class="empty-list">No contractors saved yet.</p>';
          return;
        }
        contractors = snapshot.val();
        contractorSelect.innerHTML = '<option value="">Select a contractor</option>';
        Object.keys(contractors).sort().forEach(contractorName => {
          const option = document.createElement('option');
          option.value = contractorName;
          option.textContent = contractorName;
          contractorSelect.appendChild(option);
        });
        contractorSelect.value = '';
        list.innerHTML = '<p class="empty-list">Select a contractor to view its entries.</p>';
      } catch (error) {
        list.innerHTML = `<p class="empty-list">Error loading contractors: ${error.message}</p>`;
      }
    }

    function renderContractor(contractorName) {
      list.innerHTML = '';
      if (!contractorName) {
        list.innerHTML = '<p class="empty-list">Select a contractor to view its entries.</p>';
        return;
      }
      const group = document.createElement('section');
      group.className = 'contractor-group';
      const heading = document.createElement('div');
      heading.className = 'contractor-heading';
      heading.textContent = contractorName;
      group.appendChild(heading);
      const data = contractors[contractorName] || {};
      Object.keys(data)
        .filter(key => key.startsWith('plateNumber') || key.startsWith('driverName'))
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
        .forEach(key => group.appendChild(createItem(contractorName, key, data[key])));
      list.appendChild(group);
    }

    function createItem(contractorName, key, value) {
      const item = document.createElement('div');
      item.className = 'contractor-item';
      const label = key.startsWith('plateNumber') ? 'Plate' : 'Driver';
      const text = document.createElement('div');
      text.innerHTML = `<strong>${label}</strong><span></span>`;
      text.querySelector('span').textContent = value;
      const actions = document.createElement('div');
      actions.className = 'item-actions';
      const editButton = document.createElement('button');
      editButton.textContent = 'Edit';
      editButton.addEventListener('click', () => editItem(contractorName, key, value));
      const deleteButton = document.createElement('button');
      deleteButton.textContent = 'Delete';
      deleteButton.className = 'delete-btn';
      deleteButton.addEventListener('click', () => deleteItem(contractorName, key));
      actions.append(editButton, deleteButton);
      item.append(text, actions);
      return item;
    }

    async function editItem(contractorName, key, oldValue) {
      const newValue = prompt(`Edit ${key.startsWith('plateNumber') ? 'plate number' : 'driver name'}:`, oldValue);
      if (newValue === null || !newValue.trim()) return;
      const snapshot = await get(ref(database, `contractors/${contractorName}`));
      const data = snapshot.val() || {};
      const prefix = key.startsWith('plateNumber') ? 'plateNumber' : 'driverName';
      const duplicate = Object.keys(data).some(existingKey => existingKey !== key && existingKey.startsWith(prefix) && normalized(data[existingKey]) === normalized(newValue));
      if (duplicate) {
        displayAlert(`That ${prefix === 'plateNumber' ? 'plate' : 'driver'} already exists.`, 'error');
        return;
      }
      try {
        await set(ref(database, `contractors/${contractorName}/${key}`), newValue.trim());
        displayAlert('Entry updated successfully.', 'success');
        await loadContractors();
        contractorSelect.value = contractorName;
        renderContractor(contractorName);
      } catch (error) {
        displayAlert('Error updating entry: ' + error.message, 'error');
      }
    }

    async function deleteItem(contractorName, key) {
      if (!confirm('Delete this contractor entry?')) return;
      try {
        await remove(ref(database, `contractors/${contractorName}/${key}`));
        displayAlert('Entry deleted successfully.', 'success');
        await loadContractors();
        contractorSelect.value = contractorName;
        renderContractor(contractorName);
      } catch (error) {
        displayAlert('Error deleting entry: ' + error.message, 'error');
      }
    }

    contractorSelect.addEventListener('change', () => renderContractor(contractorSelect.value));
    loadContractors();
  </script>
</head>
<body>
  <main class="container">
    <h2>Contractor List</h2>
    <p class="subtitle">Manage saved drivers and plate numbers</p>
    <div id="alert" class="alert"></div>
    <div class="contractor-select">
      <label for="contractorSelect">Contractor Name</label>
      <select id="contractorSelect">
        <option value="">Loading contractors...</option>
      </select>
    </div>
    <div id="contractorList" aria-live="polite"></div>
    <div class="navigation">
      <button onclick="window.location.href='contractor.html'">Add Contractor</button>
      <button onclick="window.location.href='index.html'">Return to Dashboard</button>
    </div>
  </main>
</body>
</html>
