<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractor Data Entry</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

    * { box-sizing: border-box; }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        /* Modern Deep Blue Gradient */
        background: radial-gradient(at 0% 0%, hsla(214,84%,70%,1) 0, transparent 50%), 
                    radial-gradient(at 50% 0%, hsla(220,58%,16%,1) 0, transparent 50%), 
                    radial-gradient(at 100% 0%, hsla(214,84%,70%,1) 0, transparent 50%);
        background-color: #0f172a;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
        overflow-y: auto;
        color: #f8fafc;
    }

    .form-container {
        background: rgba(255, 255, 255, 0.95); /* Semi-transparent white */
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 980px;
        backdrop-filter: blur(10px);
    }

    h2 {
        text-align: center;
        color: #1e293b;
        margin-bottom: 8px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    @media (max-width: 760px) { .form-container { padding: 28px 20px; } }

    /* Subtitle effect */
    .form-container::before {
        content: "Logistics Management System";
        display: block;
        text-align: center;
        font-size: 12px;
        text-transform: uppercase;
        color: #94a3b8;
        margin-bottom: 24px;
        letter-spacing: 1px;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #475569;
        text-transform: uppercase;
    }

    input {
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border: 2px solid #f1f5f9;
        border-radius: 12px;
        font-size: 15px;
        background-color: #f8fafc;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    input:focus {
        border-color: #3b82f6;
        background-color: #fff;
        outline: none;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    button {
        width: 100%;
        padding: 16px;
        background: linear-gradient(to bottom right, #3b82f6, #2563eb);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        transition: all 0.3s ease;
    }

    button:hover {
        background: linear-gradient(to bottom right, #2563eb, #1d4ed8);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
    }

    .alert {
        padding: 14px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 20px;
        text-align: center;
        display: none;
    }

    .alert.success { background-color: #dcfce7; color: #166534; display: block; }
    .alert.error { background-color: #fee2e2; color: #991b1b; display: block; }

    .back-btn {
        background: transparent !important;
        color: #94a3b8 !important;
        margin-top: 16px;
        font-weight: 500;
        box-shadow: none !important;
    }

    .back-btn:hover { color: #64748b !important; transform: none; }
</style>
    <!-- Firebase SDK v9+ for modular imports -->
    <script type="module">
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyA7k0MQEV0Q1Yehjy4pZZhGnQaBrQMhKEU",
        authDomain: "drgenerator-c598e.firebaseapp.com",
        projectId: "drgenerator-c598e",
        storageBucket: "drgenerator-c598e.firebasestorage.app",
        messagingSenderId: "936022417844",
        appId: "1:936022417844:web:e4f2778b3313fc8c78d2e1",
        measurementId: "G-7WDR6XCDVE"
    };

    // Import the Firebase modules
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
    import { getDatabase, ref, get, update } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js';

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const contractorForm = document.getElementById('contractorForm');

    function normalized(value) {
        return value.trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function nextKey(data, prefix) {
        const numbers = Object.keys(data)
            .filter(key => key.startsWith(prefix))
            .map(key => Number(key.slice(prefix.length)))
            .filter(Number.isFinite);
        return `${prefix}${numbers.length ? Math.max(...numbers) + 1 : 1}`;
    }

    contractorForm.addEventListener('submit', async event => {
        event.preventDefault();
        const contractorName = document.getElementById('contractor').value.trim();
        const plateNumber = document.getElementById('plateNumber').value.trim();
        const driverName = document.getElementById('driverName').value.trim();
        if (!contractorName || !plateNumber || !driverName) {
            displayAlert('Please fill all fields', 'error');
            return;
        }
        try {
            const contractorRef = ref(database, `contractors/${contractorName}`);
            const snapshot = await get(contractorRef);
            const data = snapshot.exists() ? snapshot.val() : {};
            const plateExists = Object.keys(data).some(key => key.startsWith('plateNumber') && normalized(data[key]) === normalized(plateNumber));
            const driverExists = Object.keys(data).some(key => key.startsWith('driverName') && normalized(data[key]) === normalized(driverName));
            const changes = {};
            if (!plateExists) changes[nextKey(data, 'plateNumber')] = plateNumber;
            if (!driverExists) changes[nextKey(data, 'driverName')] = driverName;
            if (!Object.keys(changes).length) {
                displayAlert('Both plate number and driver already exist.', 'error');
                return;
            }
            await update(contractorRef, { contractorName, ...changes });
            displayAlert(plateExists || driverExists ? 'Only the new entry was added.' : 'Contractor saved successfully!', 'success');
            contractorForm.reset();
        } catch (error) {
            displayAlert('Error saving data: ' + error.message, 'error');
        }
    });

    function displayAlert(message, type) {
        const alertDiv = document.getElementById('alert');
        alertDiv.textContent = message;
        alertDiv.classList.remove('success', 'error');
        alertDiv.classList.add(type);
    }
</script>
</head>
<body>
    <div class="form-container">
        <h2>Contractor Entry</h2>
        <div id="alert" class="alert"></div>

        <form id="contractorForm">
            <div style="margin-bottom: 5px;">
                <label for="contractor">Contractor Name</label>
                <input type="text" id="contractor" placeholder="Enter Company Name" required>
            </div>

            <div style="margin-bottom: 5px;">
                <label for="plateNumber">Plate Number</label>
                <input type="text" id="plateNumber" placeholder="ABC-1234" required>
            </div>

            <div style="margin-bottom: 5px;">
                <label for="driverName">Driver Name</label>
                <input type="text" id="driverName" placeholder="Juan Dela Cruz" required>
            </div>

            <button type="submit">Complete Registration</button>
        </form>

        <button class="back-btn" onclick="window.location.href='contractor-list.html'">
            View Contractor List
        </button>

        <button class="back-btn" onclick="window.location.href='index.html'">
            ← Return to Dashboard
        </button>
    </div>
</body>
