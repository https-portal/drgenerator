<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Size Entry</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      background: linear-gradient(135deg, #dfeaf2, #f7fafc);
      background-image: linear-gradient(135deg, rgba(255,255,255,.75), transparent 50%), linear-gradient(315deg, rgba(30, 91, 119, .14), transparent 55%);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .form-container {
      background: rgba(255, 255, 255, .96);
      padding: 38px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(27, 54, 72, .14);
      width: 100%;
      max-width: 470px;
    }
    h2 {
      text-align: center;
      color: #123b51;
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.6px;
    }
    .subtitle { margin: 0 0 28px; text-align: center; color: #718494; font-size: 13px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .4px;
      margin-bottom: 8px;
      color: #476170;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 22px;
      border: 1px solid #c8d6df;
      border-radius: 9px;
      font: inherit;
      font-size: 15px;
      color: #173042;
      background: #f8fbfd;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    input:focus {
      border-color: #1c7180;
      background: #fff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(28, 113, 128, .12);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1c7180;
      color: white;
      border: none;
      border-radius: 9px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    button:hover {
      background: #155b67;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(21, 91, 103, .2);
    }
    .alert {
      min-height: 20px;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 600;
    }
    .alert.success {
      color: #16803c;
    }
    .alert.error { color: #b42318; }
    .links { display: flex; gap: 10px; margin-top: 16px; }
    .links a {
      flex: 1;
      padding: 11px 8px;
      border-radius: 8px;
      color: #fff;
      background: #617583;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .links a:first-child { background: #d97706; }
    .links a:hover { filter: brightness(.92); }
    @media (max-width: 480px) {
      body { padding: 14px; }
      .form-container { padding: 28px 20px; }
      .links { flex-direction: column; }
    }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyA7k0MQEV0Q1Yehjy4pZZhGnQaBrQMhKEU",
      authDomain: "drgenerator-c598e.firebaseapp.com",
      projectId: "drgenerator-c598e",
      storageBucket: "drgenerator-c598e.appspot.com",
      messagingSenderId: "936022417844",
      appId: "1:936022417844:web:e4f2778b3313fc8c78d2e1",
      measurementId: "G-7WDR6XCDVE"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Form submit handler
    window.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById("sizeForm");
      const alertDiv = document.getElementById("alert");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const sizeValue = document.getElementById("sizeInput").value.trim();

        if (!sizeValue) {
          showAlert("Please enter a size.", "error");
          return;
        }

        const sizeRef = ref(db, "size");

        try {
          const snapshot = await get(sizeRef);
          const existingData = snapshot.exists() ? snapshot.val() : {};
          const normalizedSize = value => value.trim().replace(/\s+/g, " ").toLowerCase();
          const duplicate = Object.values(existingData).some(value => normalizedSize(String(value)) === normalizedSize(sizeValue));
          if (duplicate) {
            showAlert("That size already exists.", "error");
            return;
          }

          const numbers = Object.keys(existingData)
            .filter(key => key.startsWith("size"))
            .map(key => Number(key.slice(4)))
            .filter(Number.isFinite);
          const key = `size${numbers.length ? Math.max(...numbers) + 1 : 1}`;

          await set(ref(db, `size/${key}`), sizeValue);
          showAlert("Size added successfully!", "success");
          form.reset();
        } catch (error) {
          showAlert("Error saving data: " + error.message, "error");
        }
      });

      function showAlert(message, type) {
        alertDiv.textContent = message;
        alertDiv.className = `alert ${type}`;
      }
    });
  </script>
</head>
<body>
  <div class="form-container">
    <h2>Enter Size</h2>
    <p class="subtitle">Add a pole size to your list</p>
    <div id="alert" class="alert"></div>
    <form id="sizeForm">
      <label for="sizeInput">Size:</label>
      <input type="text" id="sizeInput" required />
      <button type="submit">Submit</button>
    </form>
    <div class="links">
      <a href="size-list.html">View Sizes</a>
      <a href="index.html">Back to Dashboard</a>
    </div>
  </div>
</body>
